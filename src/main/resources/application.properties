############
# Secrets
############
secret.cityOfWinnipeg=***
############
# Endpoint Configuration
############
endpoint.cityOfWinnipeg.host=https://data.winnipeg.ca
endpoint.cityOfWinnipeg.path=/resource/yg42-q284.json
# Max records to pull from the API per refresh.
endpoint.cityOfWinnipeg.limit=200
# Also pull incidents closed within this many hours (shown as "closed", toggleable in the UI).
endpoint.cityOfWinnipeg.closedWindowHours=2
# Retention window by call time (hours). Bounds both the API query and the display filter.
endpoint.cityOfWinnipeg.callWindowHours=24

############
# Database (embedded Apache Derby)
############
spring.datasource.url=jdbc:derby:incidents;create=true
spring.datasource.driver-class-name=org.apache.derby.jdbc.EmbeddedDriver

############
# Logging
############
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO
############
# Error handling
############
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never

