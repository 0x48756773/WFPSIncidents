############
# Secrets
############
secret.cityOfWinnipeg=***
############
# Site identity
############
# Canonical public origin, no trailing slash. Every absolute URL the app emits
# (canonical tag, Open Graph, JSON-LD, sitemap, robots) is built from this, so a
# domain move is a one-line change here rather than a hunt through templates.
app.baseUrl=https://wfps.redspectrum.ca
# Contact address surfaced in the footer. Independent of app.baseUrl -- the
# mailbox does not have to live on the same domain as the site.
app.contactEmail=wfps@jdsecurity.ca
# Named author, surfaced on /about and as the feed author.
app.authorName=Johnathan Drozdowski
# How often this site polls the City for new incidents, and how often the page reloads.
# This is our polling interval, not the City's publishing interval — WFPS publishes on a
# five-minute cycle, so a shorter interval here shortens the lag to their update rather
# than producing fresher data than the source has. Quoted in the page copy from this value.
app.refreshSeconds=60
############
# Endpoint Configuration
############
endpoint.cityOfWinnipeg.host=https://data.winnipeg.ca
endpoint.cityOfWinnipeg.path=/resource/yg42-q284.json
# Max records to pull from the API per refresh.
endpoint.cityOfWinnipeg.limit=200
# Also pull incidents closed within this many hours (shown as "closed", toggleable in the UI).
endpoint.cityOfWinnipeg.closedWindowHours=2
# Retention window by call time (hours). Bounds both the API query and the display filter.
endpoint.cityOfWinnipeg.callWindowHours=24

############
# Database (embedded Apache Derby)
############
spring.datasource.url=jdbc:derby:incidents;create=true
spring.datasource.driver-class-name=org.apache.derby.jdbc.EmbeddedDriver

############
# Static assets & compression
############
# Vendored assets and stylesheets change only when deployed, so let clients hold them.
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.cache=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/xml,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

############
# Logging
############
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO
############
# Error handling
############
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never

